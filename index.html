<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Szambonurki</title>
<link rel="manifest" href="./manifest.json">
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --green: #00e676;
    --text: #ffffff;
    --muted: #aaaaaa;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; padding-bottom: 40px; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 16px; }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .header h1 { font-size: 18px; margin: 0; line-height: 1.2; }
  .header-btns { display: flex; gap: 8px; }
  .btn-action { background: #222; color: #fff; border: 1px solid #444; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  
  .main-counter {
    background: linear-gradient(135deg, #1b5e20, #000000);
    border: 1.5px solid rgba(0, 230, 118, 0.5);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .main-counter .mode-selector {
    display: flex;
    justify-content: center;
    background: rgba(0,0,0,0.4);
    border-radius: 20px;
    padding: 3px;
    margin-bottom: 12px;
    max-width: 200px;
    margin-left: auto;
    margin-right: auto;
  }
  .mode-btn {
    flex: 1; background: transparent; border: none; color: #aaa; font-weight: bold; padding: 6px 0; border-radius: 16px; font-size: 12px; cursor: pointer;
  }
  .mode-btn.active { background: var(--green); color: #000; }

  .main-counter .label { font-size: 12px; color: #ccc; letter-spacing: 1px; text-transform: uppercase; }
  .main-counter .amount { font-size: 36px; font-weight: bold; color: var(--green); font-family: monospace; margin: 10px 0; }
  .main-counter .sub { font-size: 13px; color: #ddd; margin-bottom: 16px; }
  
  .counter-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-main {
    background-color: #2e7d32; color: white; border: none; padding: 12px 20px;
    font-size: 15px; font-weight: bold; border-radius: 24px; cursor: pointer; flex: 1; min-width: 130px;
  }
  .btn-main.running { background-color: #d32f2f; }
  
  .section-title { font-size: 12px; font-weight: bold; color: var(--muted); text-align: center; margin-bottom: 10px; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .cat-card {
    background-color: var(--card); border: 1px solid #333; border-radius: 12px;
    padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; position: relative;
  }
  .cat-card.active { border-width: 2.5px; background-color: rgba(255,255,255,0.06); }
  .cat-title { font-weight: bold; font-size: 15px; margin-bottom: 6px; }
  .cat-money { font-size: 18px; font-weight: bold; margin-bottom: 4px; font-family: monospace; }
  .cat-time { font-size: 12px; color: var(--muted); }
  .edit-btn {
    position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.1); border: none; color: #aaa;
    border-radius: 4px; padding: 2px 6px; font-size: 10px; cursor: pointer;
  }
  .edit-btn:hover { background: var(--green); color: #000; }

  .schedule-section { background-color: var(--card); border-radius: 12px; padding: 14px; border: 1px solid #333; margin-bottom: 16px; }
  .schedule-section h2 { font-size: 15px; margin-top: 0; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .month-nav button { background: #333; color: #fff; border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-weight: bold; }
  .month-nav button:hover { background: var(--green); color: #000; }

  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 12px; }
  .cal-header-day { font-size: 11px; color: var(--muted); padding: 4px 0; font-weight: bold; }
  .cal-day {
    background: #121212; border: 1px solid #333; border-radius: 6px; padding: 3px 2px;
    font-size: 9px; cursor: pointer; min-height: 68px; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    position: relative; overflow: hidden;
  }
  .cal-day.today { border-color: var(--green); }
  .cal-day.holiday { background: rgba(224,64,251,0.15); border-color: #e040fb; }
  
  .shift-tag { font-size: 8px; background: rgba(0,0,0,0.6); padding: 1px 3px; border-radius: 3px; color: #fff; z-index: 2; }
  .day-top-info { display: flex; justify-content: space-between; width: 100%; padding: 0 2px; font-size: 9px; z-index: 2; }
  .day-sub-sums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; justify-content: center; z-index: 2; width: 100%; margin-top: 2px; margin-bottom: 2px; }
  .mini-badge { font-size: 7px; padding: 1px 3px; border-radius: 2px; font-weight: bold; font-family: monospace; text-align: left; display: flex; justify-content: space-between; }

  .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
  .modal-content { background: var(--card); border: 1px solid #444; border-radius: 12px; padding: 20px; width: 90%; max-width: 360px; text-align: center; }
  .modal-content h3 { margin-top: 0; font-size: 16px; }
  .shift-select-btn { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; text-align: left; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }

  .settings { background-color: var(--card); border-radius: 12px; padding: 14px; border: 1px solid #333; margin-bottom: 16px; }
  .settings h2 { font-size: 16px; margin-top: 0; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .input-group { flex: 1; display: flex; flex-direction: column; }
  .input-group label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .input-group input {
    background: #121212; border: 1px solid #444; color: #fff; padding: 10px;
    border-radius: 8px; font-size: 15px; width: 100%;
  }
